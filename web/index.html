<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intensive Writer — Nền tảng luyện viết IELTS Task 2 toàn diện</title>
  <meta name="description" content="Luyện viết IELTS Writing Task 2 theo phương pháp Scaffold: khám phá ý tưởng, kiến tạo dàn ý, viết từng đoạn và nhận phản hồi chi tiết từ AI.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap&subset=vietnamese,latin-ext" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- Topbar -->
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">🌻</span>
        Intensive <em>Writer</em>
      </div>

      <div class="topbar-right">
        <span id="aiStatusBadge" class="ai-status-badge">
          <span class="indicator-dot"></span>Demo / Offline AI
        </span>
        <button id="accountBtn" class="icon-btn" title="Đăng nhập để đồng bộ tiến độ">
          👤 <span id="accountBtnLabel">Đăng nhập</span>
        </button>
        <a href="../admin/" class="icon-btn" title="Trang quản trị viên" style="text-decoration:none;">
          🔐 <span>Quản trị</span>
        </a>
        <nav class="tabs">
          <button class="tab-btn active" data-tab="practice">Luyện viết</button>
          <button class="tab-btn" data-tab="dashboard">Bảng điều khiển</button>
        </nav>
      </div>
    </header>

    <!-- Main Views -->
    <main id="view-practice" class="view active"></main>
    <main id="view-dashboard" class="view"></main>
  </div>

  <!-- Account Modal: authentication is handled by the API server -->
  <div id="accountModal" class="modal-backdrop">
    <div class="modal-box">
      <div class="modal-head">
        <h3>👤 Tài khoản học viên</h3>
        <button class="drawer-close" type="button" data-auth-close aria-label="Đóng">✕</button>
      </div>
      <form id="accountLoginForm">
        <div class="modal-body">
          <p style="margin-top:0;font-size:0.92rem;color:var(--ink-soft);line-height:1.6;">Đăng nhập để đồng bộ bài viết, lựa chọn và feedback giữa các thiết bị. Khi chưa kết nối API, bạn vẫn có thể dùng chế độ demo lưu trên trình duyệt này.</p>
          <label style="font-weight:600;font-size:0.9rem;display:block;margin-top:14px;">Email
            <input type="email" id="accountEmail" class="input-field" placeholder="you@example.com" autocomplete="username" required>
          </label>
          <label style="font-weight:600;font-size:0.9rem;display:block;margin-top:14px;">Mật khẩu
            <input type="password" id="accountPassword" class="input-field" placeholder="Tối thiểu 10 ký tự" autocomplete="current-password" minlength="10" required>
          </label>
          <p id="authMessage" class="auth-message" role="status" aria-live="polite"></p>
        </div>
        <div class="modal-foot">
          <button type="button" class="ghost-btn" data-auth-close>Đóng</button>
          <button type="button" id="logoutAccountBtn" class="ghost-btn" hidden>Đăng xuất</button>
          <button type="button" id="registerAccountBtn" class="ghost-btn" hidden>Đăng ký</button>
          <button type="submit" class="primary-btn">Đăng nhập</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Full Essay Modal -->
  <div id="fullEssayModal" class="modal-backdrop">
    <div class="modal-box" style="width:min(680px, 100%);">
      <div class="modal-head">
        <div>
          <h3 style="margin:0;">Toàn bộ bài luận của bạn</h3>
          <span id="fullEssayWordCount" style="font-size:0.85rem;color:var(--ink-soft);"></span>
        </div>
        <button class="drawer-close modal-close">✕</button>
      </div>
      <div class="modal-body" id="fullEssayContent"></div>
      <div class="modal-foot">
        <button class="ghost-btn" id="downloadEssayBtn">📥 Tải file .txt</button>
        <button class="primary-btn" id="copyEssayBtn">📋 Sao chép toàn bộ</button>
      </div>
    </div>
  </div>

  <!-- Application Scripts -->
  <script src="../shared/js/config.js"></script>
  <script src="../shared/js/api-client.js"></script>
  <script src="../shared/js/storage.js"></script>
  <script src="../shared/js/data.js"></script>
  <script src="../shared/js/ai-service.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
